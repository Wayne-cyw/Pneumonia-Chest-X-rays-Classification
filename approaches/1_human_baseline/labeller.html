<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chest X-ray Labeller</title>
<style>
  :root { --bg:#111418; --panel:#1b2026; --fg:#e8ecf1; --muted:#8a94a3; --pos:#d9534f; --neg:#3c9d6b; --acc:#5b9bd5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, Arial, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #bar { height:4px; background:#2a313a; }
  #bar div { height:100%; width:0; background:var(--acc); transition:width .2s; }
  main { display:flex; gap:20px; padding:20px; max-width:1100px; margin:0 auto; }
  #viewer { flex:1; background:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; min-height:70vh; }
  #viewer img { max-width:100%; max-height:80vh; }
  aside { width:260px; display:flex; flex-direction:column; gap:12px; }
  .id { font-size:20px; font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  button { font:inherit; color:var(--fg); background:var(--panel); border:1px solid #2f3742; border-radius:6px; padding:10px 12px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.pos.sel { background:var(--pos); border-color:var(--pos); }
  button.neg.sel { background:var(--neg); border-color:var(--neg); }
  .row { display:flex; gap:8px; } .row button { flex:1; }
  textarea { width:100%; background:var(--panel); color:var(--fg); border:1px solid #2f3742; border-radius:6px; padding:8px; font:inherit; resize:vertical; }
  #grid { display:flex; flex-wrap:wrap; gap:4px; }
  #grid span { width:22px; height:22px; border-radius:4px; background:#2a313a; font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #grid span.done { background:var(--acc); } #grid span.cur { outline:2px solid #fff; }
  @media (max-width:760px){ main{flex-direction:column;} aside{width:100%;} }
</style>
</head>
<body>
<header><h1>Chest X-ray Labeller &mdash; Pneumonia (Positive) vs Normal (Negative)</h1><span class="muted" id="count"></span></header>
<div id="bar"><div></div></div>
<main>
  <div id="viewer"><img id="img" alt="chest x-ray"></div>
  <aside>
    <div class="id" id="exid"></div>
    <div class="row">
      <button class="pos" id="bpos">Positive (P)</button>
      <button class="neg" id="bneg">Negative (N)</button>
    </div>
    <textarea id="notes" rows="4" placeholder="Notes (optional): what made you decide, how confident, etc."></textarea>
    <div class="row"><button id="prev">&larr; Prev</button><button id="next">Next &rarr;</button></div>
    <button id="export">Export human_baseline.csv</button>
    <button id="reset" class="muted">Clear all labels</button>
    <div id="grid"></div>
    <div class="muted">Keys: P / N to label, &larr; &rarr; to move. Progress is saved in this browser automatically. Click Export when all 40 are done, then move the file into the eval/ folder.</div>
  </aside>
</main>
<script>
// IDs copied from eval/predictions/human_eval_template.csv, in the same order.
const IDS = ["ex_023","ex_026","ex_042","ex_051","ex_073","ex_097","ex_114","ex_124","ex_150","ex_163",
  "ex_166","ex_169","ex_172","ex_187","ex_201","ex_213","ex_216","ex_222","ex_248","ex_266",
  "ex_272","ex_284","ex_285","ex_300","ex_312","ex_318","ex_319","ex_349","ex_362","ex_363",
  "ex_433","ex_438","ex_467","ex_475","ex_546","ex_562","ex_579","ex_592","ex_606","ex_619"];
const KEY = "xray_human_labels_v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
let i = 0;

const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const cur = () => state[IDS[i]] || (state[IDS[i]] = { label: "", notes: "" });

function render() {
  const id = IDS[i], s = state[id] || { label: "", notes: "" };
  $("img").src = "images/" + id + ".jpeg";
  $("exid").textContent = id + "  (" + (i + 1) + "/" + IDS.length + ")";
  $("bpos").classList.toggle("sel", s.label === "Positive");
  $("bneg").classList.toggle("sel", s.label === "Negative");
  $("notes").value = s.notes;
  const done = IDS.filter(x => state[x] && state[x].label).length;
  $("count").textContent = done + " / " + IDS.length + " labelled";
  document.querySelector("#bar div").style.width = (100 * done / IDS.length) + "%";
  $("grid").innerHTML = "";
  IDS.forEach((x, k) => {
    const d = document.createElement("span");
    d.textContent = k + 1;
    if (state[x] && state[x].label) d.classList.add("done");
    if (k === i) d.classList.add("cur");
    d.onclick = () => { i = k; render(); };
    $("grid").appendChild(d);
  });
}
function setLabel(l) { cur().label = l; save(); if (i < IDS.length - 1) i++; render(); }
function go(d) { i = Math.min(IDS.length - 1, Math.max(0, i + d)); render(); }
function csvCell(v) { return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

$("bpos").onclick = () => setLabel("Positive");
$("bneg").onclick = () => setLabel("Negative");
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("notes").oninput = e => { cur().notes = e.target.value; save(); };
$("reset").onclick = () => { if (confirm("Clear all labels?")) { state = {}; save(); i = 0; render(); } };
$("export").onclick = () => {
  const missing = IDS.filter(x => !(state[x] && state[x].label));
  if (missing.length && !confirm(missing.length + " images are unlabelled. Export anyway?")) return;
  const rows = ["Example ID,Human Prediction,Notes"].concat(IDS.map(x => {
    const s = state[x] || { label: "", notes: "" };
    return [x, s.label, s.notes].map(csvCell).join(",");
  }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.join("\n") + "\n"], { type: "text/csv" }));
  a.download = "human_baseline.csv";
  a.click();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (k === "p") setLabel("Positive");
  else if (k === "n") setLabel("Negative");
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
});
render();
</script>
</body>
</html>
